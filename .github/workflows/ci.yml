name: CI

# Builds the debug APK and runs the checks on every push.
# No YouTube key here: the repo is public, so CI uses the empty-key fallback
# (debug builds warn and carry an empty key; nothing in the tests calls YouTube).

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for gitleaks

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Format, lint, unit tests, build
        run: ./gradlew spotlessCheck lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: focustube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
